<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC-1 Image Preview</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .image-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      max-width: 760px;
      width: 100%;
      text-align: center;
    }

    .image-card__media {
      position: relative;
      padding: 24px;
      background: #121212;
    }

    .image-card__media img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    .image-card__body {
      padding: 24px;
    }

    .image-card__title {
      margin: 0 0 12px;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    .image-card__description {
      margin: 0;
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
    }

    .image-card__note {
      margin-top: 18px;
      padding: 12px 16px;
      background: #f7f7f7;
      border-radius: 8px;
      color: #666;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <article class="image-card">
    <div class="image-card__media">
      <img src="./assests/images/FC-1.png" alt="FC-1 image preview" />
    </div>
    <div class="image-card__body">
      <h1 class="image-card__title">FC-1 Image Preview</h1>
      <p class="image-card__description">
        This HTML5 page shows the `FC-1.png` image from the project assets inside an image div.
      </p>
      <p class="image-card__note">
        File path: <strong>/puplicdata/assests/imagesFC-1.png</strong>
      </p>
    </div>
  </article>
</body>
</html>
